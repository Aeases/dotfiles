# Framework (ALC295) analog card: speakers and the headphone jack as separate
# profiles, so each gets its own sink node (and its own name) instead of being
# two ports on one sink. Jack detection still marks the speaker profile
# unavailable while headphones are plugged in, so WirePlumber switches between
# them automatically.
# Loaded via device.profile-set in ~/.config/wireplumber/wireplumber.conf.d/frameblasters-split.conf

[General]
auto-profiles = no

[Mapping analog-stereo-speaker]
description = Speakers
device-strings = front:%f
channel-map = left,right
paths-output = analog-output-speaker
direction = output

[Mapping analog-stereo-headphones]
description = Headphones
device-strings = front:%f
channel-map = left,right
paths-output = analog-output-headphones
direction = output

# Internal mic keeps the stock mapping name, so its node name (which DeepFilter
# and the saved default source refer to) does not change.
[Mapping analog-stereo]
description = Internal Microphone
device-strings = front:%f
channel-map = left,right
paths-input = analog-input-internal-mic
direction = input

[Mapping analog-stereo-headset]
description = Headset Microphone
device-strings = front:%f
channel-map = left,right
paths-input = analog-input-headset-mic
direction = input

# The combo jack cannot tell whether the plugged-in headphones have a mic, so
# plugging in keeps the internal mic (higher priority). The jack mic is opt-in
# via the "Headphones + Jack Mic" profile; WirePlumber remembers that choice.
[Profile output:speaker+input:analog-stereo]
description = Speakers
output-mappings = analog-stereo-speaker
input-mappings = analog-stereo
priority = 200

[Profile output:headphones+input:analog-stereo]
description = Headphones
output-mappings = analog-stereo-headphones
input-mappings = analog-stereo
priority = 100

[Profile output:headphones+input:analog-stereo-headset]
description = Headphones + Jack Mic
output-mappings = analog-stereo-headphones
input-mappings = analog-stereo-headset
priority = 50
