[Unit]
# Plasma owns the bar and notifications; only run these under Hyprland
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland

[Service]
# The environment can be stale right after Hyprland exits (the user manager outlives a quick
# logout/login), and Restart= would then bring this back inside Plasma, so also require a
# live Hyprland. Checked on every start, including automatic restarts.
ExecCondition=/usr/bin/pgrep -u %u -x Hyprland
# screenshare.css is gitignored runtime state (written by ~/.scripts/screenshare-privacy);
# create it empty on a fresh clone so style.css's @import doesn't fail.
ExecStartPre=/usr/bin/touch %h/.config/waybar/screenshare.css
RestartSec=3
