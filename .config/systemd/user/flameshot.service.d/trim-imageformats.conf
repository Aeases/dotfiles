[Service]
# Qt eagerly loads every plugin in the imageformats dir and advertises a clipboard MIME
# type per writable format -- 37 types, encoded on demand and single-threaded, so a
# clipboard manager buffering the selection stalls flameshot for seconds after a capture.
# Mask the directory for this service only and bind back the plugins flameshot needs.
# Explicit keep-list rather than a kimg_* pattern so an upstream rename can't silently
# change what gets masked. png/bmp/ppm/xbm/xpm are built into QtGui and need no plugin;
# libqsvg is kept because flameshot maps it for its UI icons.
TemporaryFileSystem=/usr/lib/qt6/plugins/imageformats:ro
BindReadOnlyPaths=/usr/lib/qt6/plugins/imageformats/libqsvg.so
BindReadOnlyPaths=/usr/lib/qt6/plugins/imageformats/libqjpeg.so
BindReadOnlyPaths=/usr/lib/qt6/plugins/imageformats/libqico.so
BindReadOnlyPaths=/usr/lib/qt6/plugins/imageformats/libqgif.so
