# ~/.config/pipewire/client.conf.d/sonobus-mic.conf
# SonoBus's own playback stream *is* the microphone: no virtual sink, nothing
# outside SonoBus, gone when it quits. pipewire-alsa names streams
# alsa_{playback,capture}.<binary>, so only the playback side is matched and
# SonoBus's own mic capture (if enabled) stays an ordinary recording stream.
stream.rules = [
    {   matches = [ { node.name = "alsa_playback.sonobus" } ]
        actions = {
            update-props = {
                media.class      = Audio/Source
                node.description = "SonoBus Mic"
                # Skip DeepFilter while this is the default mic
                # (~/.local/share/wireplumber/scripts/deepfilter-bypass.lua).
                deepfilter.bypass = true
            }
        }
    }
]
