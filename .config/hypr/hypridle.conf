general {
    lock_cmd = $HOME/repos/noctalia-shell/build/noctalia msg session lock     # runs on logind Lock (loginctl lock-session); noctalia ignores it if already locked.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# `no-egpu &&` = skipped while an eGPU is connected (lock and keyboard backlight still apply).

listener {
    timeout = 150                                                         # 2.5min.
    on-timeout = ~/.config/hypr/no-egpu && ~/.config/hypr/idle-dim.sh soft # slight dim (70% of current) as a warning before the lock.
    on-resume = ~/.config/hypr/idle-dim.sh restore                        # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = ~/.config/hypr/idle-dim.sh kbd-off        # turn off keyboard backlight.
    on-resume = ~/.config/hypr/idle-dim.sh kbd-restore     # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 360                                                          # 6min: 1min on the lock screen, then near-black
    on-timeout = ~/.config/hypr/no-egpu && ~/.config/hypr/idle-dim.sh deep # near-black, only if the lock screen is up; the 150s on-resume restores.
}

listener {
    timeout = 390                                                                                  # 6.5min
    on-timeout = ~/.config/hypr/no-egpu && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && ~/.config/hypr/idle-dim.sh restore # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                                # 30min
    on-timeout = ~/.config/hypr/no-egpu && systemctl suspend     # suspend pc
}
