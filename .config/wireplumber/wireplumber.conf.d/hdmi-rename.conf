# HDMI/DisplayPort audio outputs on the AMD GPU (alsa card c1_00.1), named after
# their ALSA ports so two connected monitors are told apart.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 0 Audio"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.1.hdmi-stereo-extra2"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 2 Audio"
      }
    }
  }
]
