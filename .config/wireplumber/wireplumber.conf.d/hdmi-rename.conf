# HDMI/DisplayPort audio outputs on the AMD GPU (alsa card c1_00.1)
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI L Audio"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.1.hdmi-stereo-extra2"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI R Audio"
      }
    }
  }
]
