# Split the Framework analog card's speaker and headphone-jack ports into
# separate profiles/sinks; see ~/.config/alsa-card-profile/mixer/profile-sets/frameblasters.conf
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_c1_00.6"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "/home/zane/.config/alsa-card-profile/mixer/profile-sets/frameblasters.conf"
      }
    }
  }
]
