monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.6.analog-stereo-speaker"
      }
    ]
    actions = {
      update-props = {
        node.description = "FrameBlasters"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.6.analog-stereo-headphones"
      }
    ]
    actions = {
      update-props = {
        node.description = "Wired Jack"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_c1_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "FrameMic"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_c1_00.6.analog-stereo-headset"
      }
    ]
    actions = {
      update-props = {
        node.description = "Wired Jack Mic"
      }
    }
  }
]
