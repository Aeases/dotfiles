# Disable the DeepFilter smart filter while the default mic has
# deepfilter.bypass = true (see ~/.local/share/wireplumber/scripts/deepfilter-bypass.lua).
wireplumber.components = [
  {
    name = deepfilter-bypass.lua, type = script/lua
    provides = custom.deepfilter-bypass
    requires = [ metadata.default, metadata.filters ]
  }
]

wireplumber.profiles = {
  main = {
    custom.deepfilter-bypass = required
  }
}
